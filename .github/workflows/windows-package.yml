name: Windows package

# Produces the Windows NSIS installer (preview). Not part of regular PR CI: a
# Windows release build costs many runner minutes. Run it by hand (Actions ->
# Windows package -> Run workflow) or push a v* tag. PRs run it only when they
# change the Windows packaging itself (this file, the build script or the
# NSIS installer hooks).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/windows-package.yml
      - scripts/package-windows.ps1
      - src-tauri/windows/**

# Default to read-only. Only the release job (below) is granted contents:write,
# and it does nothing but download the built installer and attach it to the
# Release — it never checks out the code or builds, so the write token is never
# exposed to build tooling or npm lifecycle scripts.
permissions:
  contents: read

# Actions are pinned to full commit SHAs with a version comment; Dependabot's
# github-actions updater keeps them fresh. Do not switch back to mutable tags.
jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned by SHA, so the channel can't be read from the ref — name it.
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Build installer with scripts/package-windows.ps1
        # The same script the owner runs on a Windows PC, so this job also
        # tests it: prerequisite checks, npm ci, tauri build, hashes. The
        # runner image has the VS Build Tools C++ workload, the Windows SDK and
        # WebView2. Unsigned: no Authenticode certificate in CI. No signing
        # key in this step's environment (it runs npm and cargo build
        # scripts); a later step signs the installer for the updater.
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upgrade over a pre-0.3.1 install (#17)
        # Install, then make the install look like one from before v0.3.1
        # (folder registered under the default manufacturer "sparkdown", not
        # the publisher), then run the installer again in passive mode. Same
        # version + passive takes the stock "uninstall first" path, which
        # runs the old uninstaller with `_?=<folder from the publisher key>`.
        # Without src-tauri/windows/hooks.nsh that folder is empty, the
        # uninstall fails and the installer stops on an error dialog (here:
        # a timeout).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:LOCALAPPDATA 'SparkDown'
          $cur = 'HKCU:\Software\PearTree Forge LLC\SparkDown'
          $legacy = 'HKCU:\Software\sparkdown\SparkDown'
          $uninst = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SparkDown'
          function Run-Setup([string]$arg) {
            $p = Start-Process -FilePath $setup -ArgumentList $arg -PassThru
            if (-not $p.WaitForExit(240000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "setup $arg did not finish in 4 min (stuck on an error dialog?)"
            }
            if ($p.ExitCode -ne 0) { throw "setup $arg exited with $($p.ExitCode)" }
          }
          Run-Setup '/S'
          if (-not (Test-Path "$dir\uninstall.exe")) { throw "no uninstall.exe in $dir" }
          Write-Host "UninstallString: $((Get-ItemProperty $uninst).UninstallString)"
          # Simulate the pre-0.3.1 registry layout.
          New-Item -Path $legacy -Force | Out-Null
          Set-Item -Path $legacy -Value $dir
          Remove-Item -Path $cur -Recurse -Force
          # Marker: the old uninstaller deletes the whole uninstall key, so
          # it is gone afterwards only if the uninstall really ran.
          Set-ItemProperty -Path $uninst -Name 'SdUpgradeProbe' -Value 1
          Run-Setup '/P'
          if ($null -ne (Get-ItemProperty $uninst).SdUpgradeProbe) { throw 'the previous install was not uninstalled' }
          $now = (Get-Item -Path $cur).GetValue('')
          if ($now -ne $dir) { throw "publisher key is '$now', expected '$dir'" }
          if (-not (Test-Path "$dir\uninstall.exe")) { throw "reinstall left no uninstall.exe" }
          Write-Host "OK: uninstalled the pre-0.3.1 layout and reinstalled; publisher key -> $now"
      - name: Sign the installer for the auto-updater
        # Produces <setup.exe>.sig, which scripts/release.sh reads from the
        # Release to write latest.json's windows-x86_64 entry. Runs after the
        # upgrade test (which only installs; it doesn't touch the file) so the
        # signature covers the exact bytes uploaded. Secrets:
        # TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD. Never
        # on pull requests (PR code would run with the key). Without the key
        # this only warns: the installer still builds and ships, and that
        # release's latest.json has no Windows entry (decision 8, #60).
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set; installer not signed (no Windows updater entry for this build)."
            exit 0
          }
          if (Select-String -Quiet -Path src-tauri/updater-pubkey.txt -Pattern 'REPLACE_WITH_UPDATER_PUBLIC_KEY') {
            Write-Host "::warning::src-tauri/updater-pubkey.txt is still the placeholder; installer not signed."
            exit 0
          }
          $version = node -p 'require("./src-tauri/tauri.conf.json").version'
          foreach ($f in Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe) {
            & frontend/node_modules/.bin/tauri.cmd signer sign --app-version $version $f.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "signing $($f.Name) failed" }
            Write-Host "Signed $($f.Name)"
          }
          python scripts/check-updater-sig.py (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe.sig | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { throw "signature check failed" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparkdown-windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  release:
    name: Attach to GitHub Release (tags only)
    needs: build
    # Only a pushed v* tag publishes. A manual run (workflow_dispatch), even
    # one started on a tag ref, only uploads workflow artifacts: test builds
    # never create or touch a Release, and latest.json is never written here
    # (scripts/release.sh writes it, by hand, for real releases).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The only job with write access. It does not check out the repo or run any
    # build/npm step, so the write token never reaches third-party tooling.
    permissions:
      contents: write
    steps:
      - name: Download built installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sparkdown-windows
          path: dist
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/**/*-setup.exe
            dist/**/*-setup.exe.sig
