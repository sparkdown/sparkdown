name: E2E feasibility spike

# Branch-only spike for the end-to-end plan (e2e/multi-window). Not on main.
on:
  workflow_dispatch:
  push:
    branches: ["e2e/**"]
    paths: [".github/workflows/e2e-spike.yml", "e2e/spike/**"]

permissions:
  contents: read

jobs:
  macos-ui:
    name: macOS — System Events UI scripting + real app
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Accessibility probe (TextEdit, Dock)
        run: e2e/spike/mac-ui.sh
      - name: TCC grants on the runner (read-only)
        continue-on-error: true
        run: |
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "== $db"; sudo sqlite3 "$db" "select service, client, auth_value from access where service like '%Accessibility%' or service like '%AppleEvents%' or service like '%ScreenCapture%';" || true
          done | tee -a "$OUT/tcc.txt"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Build SparkDown.app (release bundle, unsigned)
        run: |
          start=$(date +%s)
          (cd frontend && npm ci) && frontend/node_modules/.bin/tauri build --bundles app
          echo "build_seconds=$(( $(date +%s) - start ))" | tee -a "$OUT/timing.txt"
      - name: Drive the real app with System Events
        continue-on-error: true
        run: e2e/spike/mac-app.sh "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/macos/SparkDown.app"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-macos
          path: e2e-out

  windows-driver:
    name: Windows — tauri-driver + UIA against the real app
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}\e2e-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Build sparkdown.exe (release, no installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Push-Location frontend; npm ci; Pop-Location
          & .\frontend\node_modules\.bin\tauri.cmd build --no-bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "build_seconds=$([int]$sw.Elapsed.TotalSeconds)" | Tee-Object -Append "$env:OUT\timing.txt"
      - name: tauri-driver + matching msedgedriver
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cargo install tauri-driver --locked
          "tauri_driver_install_seconds=$([int]$sw.Elapsed.TotalSeconds)" | Tee-Object -Append "$env:OUT\timing.txt"
          $wv = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          "webview2=$wv preinstalled_edgedriver=$env:EDGEWEBDRIVER" | Tee-Object -Append "$env:OUT\win-driver.log"
          if ($env:EDGEWEBDRIVER) { & "$env:EDGEWEBDRIVER\msedgedriver.exe" --version | Tee-Object -Append "$env:OUT\win-driver.log" }
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$wv/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
          & .\edgedriver\msedgedriver.exe --version | Tee-Object -Append "$env:OUT\win-driver.log"
      - name: Drive the real app (WebDriver + UIA)
        shell: pwsh
        run: python e2e/spike/win_driver.py "$env:GITHUB_WORKSPACE\src-tauri\target\release\sparkdown.exe" "$env:GITHUB_WORKSPACE\edgedriver\msedgedriver.exe"
      - name: Drive the real app (self-launch with CDP port, attach msedgedriver)
        if: always()
        shell: pwsh
        run: python e2e/spike/win_attach.py "$env:GITHUB_WORKSPACE\src-tauri\target\release\sparkdown.exe" "$env:GITHUB_WORKSPACE\edgedriver\msedgedriver.exe"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-windows
          path: e2e-out

  omarchy-hyprland:
    name: Omarchy-like — Hyprland in an Arch container (vkms DRM) + grim
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Virtual KMS device on the host (vkms)
        continue-on-error: true
        run: |
          uname -r
          sudo modprobe vkms || { sudo apt-get update -qq && sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe vkms; }
          ls -l /dev/dri || true
      - name: Boot Hyprland in archlinux:latest, screenshot with grim
        run: |
          mkdir -p out; start=$(date +%s)
          dev=""; [ -d /dev/dri ] && dev="--device /dev/dri"
          docker run --rm --privileged $dev -v "$PWD:/w" -v "$PWD/out:/out" -w /w archlinux:latest bash e2e/spike/hypr.sh
          echo "total_seconds=$(( $(date +%s) - start ))" | tee -a out/timing.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-hyprland
          path: out
