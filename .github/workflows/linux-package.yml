name: Linux package

# Produces AppImage + .deb for Omarchy / Linux. Not part of PR CI.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Default to read-only. Only the release job (below) is granted contents:write,
# and it does nothing but download the built artifacts and attach them to the
# Release — it never checks out the code or builds, so the write token is never
# exposed to build tooling or npm lifecycle scripts.
permissions:
  contents: read

# Actions are pinned to full commit SHAs with a version comment; Dependabot's
# github-actions updater keeps them fresh. Do not switch back to mutable tags.
jobs:
  build:
    name: Build AppImage and deb
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential curl wget file libssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # Pinned by SHA, so the channel can't be read from the ref — name it.
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Build Linux bundles
        # From the repo root, like scripts/package-macos.sh — the Tauri CLI
        # resolves src-tauri/ from the invocation directory, and frontend/ is
        # a sibling of it (running inside frontend/ fails to find the project).
        # No signing key in this step's environment (it runs npm, vite and
        # cargo build scripts); the next step signs the AppImage.
        run: frontend/node_modules/.bin/tauri build --bundles appimage,deb
      - name: Sign AppImage for the auto-updater
        # Produces <AppImage>.sig, which scripts/release.sh reads from the
        # Release to write latest.json. Owner setup: add the repo secrets
        # TAURI_SIGNING_PRIVATE_KEY (the content of
        # ~/.tauri/sparkdown-updater.key) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        # (empty if the key has none). Without them this step only warns: the
        # bundles still build and ship, but that release has no Linux
        # auto-update entry. The key is visible only to the Tauri signer here.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set; AppImage not signed (no Linux auto-update for this build)."
            exit 0
          fi
          if grep -q 'REPLACE_WITH_UPDATER_PUBLIC_KEY' src-tauri/updater-pubkey.txt; then
            echo "::warning::src-tauri/updater-pubkey.txt is still the placeholder; AppImage not signed."
            exit 0
          fi
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            frontend/node_modules/.bin/tauri signer sign --app-version "$version" "$f" >/dev/null
            echo "Signed $f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparkdown-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb

  release:
    name: Attach to GitHub Release (tags only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The only job with write access. It does not check out the repo or run any
    # build/npm step, so the write token never reaches third-party tooling.
    permissions:
      contents: write
    steps:
      - name: Download built bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sparkdown-linux
          path: dist
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/**/*.AppImage
            dist/**/*.AppImage.sig
            dist/**/*.deb
