name: Linux package

# Produces AppImage + .deb, and a pacman package made from the .deb, for
# Omarchy / Linux. Not part of PR CI. A manual run (Actions -> Linux package
# -> Run workflow) only uploads workflow artifacts; only a v* tag push
# attaches the AppImage and .deb to a Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Default to read-only. Only the release job (below) is granted contents:write,
# and it does nothing but download the built artifacts and attach them to the
# Release — it never checks out the code or builds, so the write token is never
# exposed to build tooling or npm lifecycle scripts.
permissions:
  contents: read

# Actions are pinned to full commit SHAs with a version comment; Dependabot's
# github-actions updater keeps them fresh. Do not switch back to mutable tags.
jobs:
  build:
    name: Build AppImage and deb
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential curl wget file libssl-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned by SHA, so the channel can't be read from the ref — name it.
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Build Linux bundles
        # From the repo root, like scripts/package-macos.sh — the Tauri CLI
        # resolves src-tauri/ from the invocation directory, and frontend/ is
        # a sibling of it (running inside frontend/ fails to find the project).
        # No signing key in this step's environment (it runs npm, vite and
        # cargo build scripts); the next step signs the AppImage.
        run: frontend/node_modules/.bin/tauri build --bundles appimage,deb
      - name: Sign AppImage for the auto-updater
        # Produces <AppImage>.sig, which scripts/release.sh reads from the
        # Release to write latest.json. Owner setup: add the repo secrets
        # TAURI_SIGNING_PRIVATE_KEY (the content of
        # ~/.tauri/sparkdown-updater.key) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        # (empty if the key has none). Without them this step only warns: the
        # bundles still build and ship, but that release has no Linux
        # auto-update entry. The key is visible only to the Tauri signer here.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set; AppImage not signed (no Linux auto-update for this build)."
            exit 0
          fi
          if grep -q 'REPLACE_WITH_UPDATER_PUBLIC_KEY' src-tauri/updater-pubkey.txt; then
            echo "::warning::src-tauri/updater-pubkey.txt is still the placeholder; AppImage not signed."
            exit 0
          fi
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            frontend/node_modules/.bin/tauri signer sign --app-version "$version" "$f" >/dev/null
            echo "Signed $f"
          done
          python3 scripts/check-updater-sig.py src-tauri/target/release/bundle/appimage/*.AppImage.sig
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparkdown-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb

  arch:
    # A pacman package for Arch / Omarchy test builds, made from the .deb
    # above with the repo's own PKGBUILD (packaging/aur/sparkdown-bin) and a
    # local source instead of the Release URL. Then installed in a clean
    # Arch container and run (`sparkdown --version`) as a smoke test.
    # Artifact only: never attached to a Release.
    name: Build pacman package (from the deb)
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Install git (for checkout)
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download built bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sparkdown-linux
          path: dist
      - name: makepkg from the local deb
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find dist -name '*.deb' | head -n1)
          test -n "$deb"
          version=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n1)
          pkgver="${version}.r${GITHUB_RUN_NUMBER}.g${GITHUB_SHA::7}"
          work=/tmp/pkg
          mkdir -p "$work"
          cp packaging/aur/sparkdown-bin/PKGBUILD packaging/aur/sparkdown-bin/sparkdown.desktop packaging/aur/sparkdown-bin/sparkdown.png "$work/"
          cp "$deb" "$work/sparkdown-${pkgver}.deb"
          sha=$(sha256sum "$work/sparkdown-${pkgver}.deb" | cut -d' ' -f1)
          cd "$work"
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" PKGBUILD
          # Local source: drop the Release URL, keep the file name.
          sed -i 's|::https://github\.com/sparkdown/sparkdown/releases/download/[^"]*"|"|' PKGBUILD
          sed -i "0,/^sha256sums=('[0-9a-f]*'/s//sha256sums=('${sha}'/" PKGBUILD
          grep -q "releases/download" PKGBUILD && { echo "PKGBUILD still points at a Release"; exit 1; }
          cat PKGBUILD
          useradd -m builder
          chown -R builder "$work"
          su builder -c "cd $work && makepkg -f --nodeps --noconfirm"
          ls -l "$work"/*.pkg.tar.zst
      - name: Install it in this clean Arch container and run it
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(ls /tmp/pkg/*.pkg.tar.zst)
          pacman -Qip "$pkg"
          pacman -U --noconfirm "$pkg"
          pacman -Ql sparkdown-bin
          sparkdown --version
          mkdir -p arch-dist && cp "$pkg" arch-dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparkdown-arch
          path: arch-dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Attach to GitHub Release (tags only)
    needs: build
    # Only a pushed v* tag publishes. A manual run (workflow_dispatch), even
    # one started on a tag ref, only uploads workflow artifacts: test builds
    # never create or touch a Release, and latest.json is never written here
    # (scripts/release.sh writes it, by hand, for real releases).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The only job with write access. It does not check out the repo or run any
    # build/npm step, so the write token never reaches third-party tooling.
    permissions:
      contents: write
    steps:
      - name: Download built bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sparkdown-linux
          path: dist
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/**/*.AppImage
            dist/**/*.AppImage.sig
            dist/**/*.deb
