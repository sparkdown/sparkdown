[package]
name = "sparkdown"
version = "0.4.0"
edition = "2021"
description = "A small, local markdown editor for you and your coding agents"
authors = ["Paulo Vitor Justino Pereira"]
license = "MIT"
repository = "https://github.com/sparkdown/sparkdown"
homepage = "https://sparkdown.dev/"
readme = "../README.md"
keywords = ["markdown", "editor", "tauri", "mcp", "ai-agents"]
categories = ["text-editors", "development-tools"]
publish = false

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: keep key order when SparkDown edits a user's JSON file
# (the one Cursor entry in ~/.cursor/mcp.json). indexmap is already in the
# tree via tauri, so this adds no new crate.
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-drag = "2"
thiserror = "2"
# Agent-cockpit (feat/agent-cockpit): embedded terminal + live file watching.
portable-pty = "0.9"
notify = "8"
# Auto-update signature check (minisign, as written by `tauri signer sign`).
# Pure Rust, no dependencies. Downloads use the system curl (updates.rs), so
# the app carries no HTTP/TLS stack.
minisign-verify = "0.2"
# Remote SSH first connect (#24): SHA256 host-key fingerprints, shown the
# same way ssh prints them. Both already in the tree (same versions).
sha2 = "0.11"
base64 = "0.23"
# In-app SSH key passphrase (#27): the passphrase lives only in buffers that
# are wiped on drop. Tiny, no dependencies.
zeroize = "1"
tauri-plugin-single-instance = "2"

# macOS: install an applicationShouldTerminate: delegate hook so dock/menu
# Quit can be intercepted (tao doesn't implement it). objc2 is already in the
# tree via tauri; pin to the resolved versions.
# Windows: std has no local-socket listener, so the MCP transport uses a named
# pipe via `interprocess` (Windows-only dep; the Unix build stays std-only).
# windows-sys + widestring (both already in the tree via interprocess, same
# versions) build the pipe's per-user security descriptor: the current
# user's SID from the process token, as SDDL.
# #130: system clipboard for the terminal on Linux / Windows (WebKitGTK's
# navigator.clipboard can't read it without a user gesture).
[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
interprocess = "2"
widestring = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  # Toolhelp32 snapshot: does a terminal's shell have child processes (#43).
  "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-foundation = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Tests only: sign fake update artifacts with a throwaway key made in-test.
minisign = "0.7"
ts-rs = "12"

[features]
# Test-only (E2E on Windows): let WebDriver attach to WebView2 by passing
# $SPARKDOWN_E2E_WEBVIEW2_ARGS through to the browser process. OFF by
# default and never enabled by the release/package workflows — the code is
# compiled out of shipped builds (scripts/check-release-gate.sh enforces it).
e2e-webdriver = []

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
